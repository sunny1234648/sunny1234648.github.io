<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手機相機測試</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 9 / 16;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 24px;
      background-color: #007aff;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.96);
      background-color: #0056b3;
    }
    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="camera-container">
    <!-- autoplay, playsinline 是 iOS/Safari 成功播放影片的關鍵關鍵字 -->
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn">開啟相機</button>
  </div>

  <p id="status">點擊按鈕開啟相機並授權權限</p>

  <script>
    const video = document.getElementById('webcam');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('status');

    let currentStream = null;

    async function startCamera() {
      // 若已有流在運行，先停止
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      // 相機設定：指定使用後置鏡頭 (environment)
      const constraints = {
        video: {
          facingMode: { ideal: "environment" }, // 後置相機，若要前置改為 "user"
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false // 若表演不需要錄音可設為 false
      };

      try {
        statusText.innerText = "正在請求相機權限...";
        
        // 請求媒體裝置權限
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;

        statusText.innerText = "相機已成功開啟！";
        startBtn.style.display = "none"; // 開啟成功後隱藏按鈕
      } catch (err) {
        console.error("無法存取相機:", err);
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          statusText.innerText = "錯誤：使用者拒絕了相機存取權限。";
        } else if (err.name === 'NotFoundError') {
          statusText.innerText = "錯誤：找不到可用的相機裝置。";
        } else {
          statusText.innerText = "錯誤：" + err.message;
        }
      }
    }

    startBtn.addEventListener('click', startCamera);
  </script>
</body>
</html>
