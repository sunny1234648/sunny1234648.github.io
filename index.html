<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Zheng Guanying · Camera Character Tour</title>
<style>
:root{color-scheme:dark;--ink:#eef4ff;--muted:#b6c8dd;--accent:#d5aa6e;--surface:rgba(8,20,33,.82)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121d;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:pan-y;background:radial-gradient(ellipse at 50% 32%,#31465b 0%,#142738 40%,#07121d 100%)}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent;transform:none}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,14,24,.52),transparent 26%,transparent 58%,rgba(4,14,24,.35) 87%,rgba(4,14,24,.62))}

#actor{
  position:absolute;
  left:50%;
  bottom:0;
  width:40vw;
  max-width:300px;
  min-width:90px;
  z-index:2;
  user-select:none;
  transform-origin:center bottom;
  transition:transform .25s ease,width .15s ease,opacity .25s ease;
  display:none;
  overflow:hidden;
}
#actor.visible{
  display:block;
  transform:translateX(-50%) scale(1.5);
}
#actorCropper{position:relative;width:100%;overflow:hidden}
#actorCropper .cropInner{margin-bottom:-25%}

#actorCanvas{position:relative;z-index:1;display:none;vertical-align:bottom;width:100%;height:auto}
/* Snapshot overlay: shows last frame during video switch to avoid blank frame */
#actorSnapshot{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:auto;
  z-index:2;
  display:none;
  pointer-events:none;
}
#actorPlaceholder{
  aspect-ratio:9/16;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:1px dashed rgba(255,255,255,.35);border-radius:20px;
  background:linear-gradient(180deg,rgba(214,174,108,.07),rgba(8,23,35,.1));
  text-align:center;text-shadow:0 2px 8px black;pointer-events:none
}
#actorPlaceholder .silhouette{font-size:58px;line-height:1}
#actorPlaceholder small{font-size:11px;color:var(--muted);line-height:1.6;padding:0 12px}

.header{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(180deg,rgba(3,13,24,.7),transparent);pointer-events:none}
.kicker{font-size:10px;letter-spacing:.24em;color:#e6bb83;text-transform:uppercase;font-weight:700}
.header h1{font-size:21px;letter-spacing:.1em;margin:6px 0 5px}

#hint{position:absolute;z-index:3;top:43%;width:100%;padding:0 18px;pointer-events:none;text-align:center;color:#e6eef7;text-shadow:0 2px 4px #000;font-size:14px;line-height:1.6}
#hint.hide{display:none}

#toolbar{
  position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  z-index:9;padding:8px;border:1px solid rgba(255,255,255,.2);border-radius:16px;
  background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 12px 36px rgba(0,0,0,.28);
}
.actions{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;
}
.subactions{
  display:flex;gap:6px;align-items:center;margin-top:6px;min-height:24px;
}
.subactions #prevBtn{margin-left:auto}

#adjustPanel{
  display:none;align-items:center;justify-content:space-between;gap:6px;
  border-top:1px solid rgba(255,255,255,.15);padding-top:6px;margin-top:6px;font-size:10px;color:#e0ecf7;
}
#adjustPanel.show{display:flex}
#adjustPanel label{display:inline-flex;align-items:center;gap:4px}
#adjustPanel input[type=range]{width:110px;accent-color:var(--accent)}

.btn{border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.1);color:#f8fafc;min-height:50px;padding:6px 4px;font-size:11px;font-weight:600;line-height:1.3}
.btn span{display:block;font-size:19px;margin-bottom:1px}
.btn.primary{background:#b48249;border-color:#e9c18a;color:#101820}
.btn.active{background:rgba(213,170,110,.22);border-color:var(--accent)}

.tiny,
#prevBtn,
#nextBtn{
  background:transparent;
  border:1px solid rgba(255,255,255,.2);
  border-radius:7px;
  color:#deedfc;
  padding:4px 8px;
  font-size:10px;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  gap:3px;
  height:auto;
}
#prevBtn span,
#nextBtn span{font-size:11px;line-height:1}
#prevBtn:active,
#nextBtn:active{background:rgba(213,170,110,.22);border-color:var(--accent)}

#actorVideo{position:absolute;inset:0;opacity:.001;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:0}
#toast{position:absolute;z-index:30;left:20px;right:20px;bottom:150px;padding:10px 14px;max-width:500px;margin:auto;text-align:center;background:rgba(5,20,34,.92);border:1px solid rgba(255,255,255,.22);border-radius:12px;font-size:12px;line-height:1.5;display:none}
#toast.show{display:block}

@media(min-width:700px){
  #toolbar{max-width:460px;margin:auto;left:0;right:0}
  .header{padding-left:30px}
  #hint{font-size:16px}
}

@media (orientation: landscape){
  #actor.visible{
    left:10px;
    bottom:calc(10px + env(safe-area-inset-bottom));
    transform:scale(.6);
    transform-origin:left bottom;
    overflow:visible;
  }
  #actorCropper .cropInner{margin-bottom:0}
}
@media (orientation: landscape) and (max-height:420px){
  #actor.visible{transform:scale(.45)}
}
</style>
</head>
<body>
<main id="stage" aria-label="Camera character tour view">
 <video id="camera" autoplay muted playsinline aria-label="Mobile camera preview"></video>
 <div class="header">
   <div class="kicker">Mandarin's House • AI Heritage</div>
   <h1>Zheng Guanying · Encounter Across Time</h1>
 </div>
 <div id="actor" aria-label="Zheng Guanying character position">
   <div id="actorCropper"><div class="cropInner">
     <video id="actorVideo" playsinline webkit-playsinline preload="auto" aria-label="Zheng Guanying pre-recorded video"></video>
     <canvas id="actorCanvas"></canvas>
     <canvas id="actorSnapshot" aria-hidden="true"></canvas>
     <div id="actorPlaceholder"><span class="silhouette">👤</span><strong>Character position preview</strong><small>Upload zheng.mp4 to the site root</small></div>
   </div></div>
 </div>
 <div id="hint">Tap "Start AR" to open the camera.</div>
 <div id="toast" role="status"></div>
 <div id="toolbar">
   <div class="actions">
    <button type="button" id="cameraBtn" class="btn primary"><span>📷</span>Start AR</button>
    <button type="button" id="photoBtn" class="btn"><span>📸</span>Take Photo</button>
   </div>
   <div class="subactions">
    <button type="button" id="sizeBtn" class="tiny">Adjust Size</button>
    <button type="button" id="switchCameraBtn" class="tiny" title="Switch front/back camera">Switch Camera</button>
    <button type="button" id="soundBtn" class="tiny" disabled>Enable Sound</button>
    <button type="button" id="prevBtn" disabled title="Previous video"><span>⏮</span>Prev</button>
    <button type="button" id="nextBtn" disabled title="Next video"><span>⏭</span>Next</button>
   </div>
   <div id="adjustPanel">
     <label for="size">Character size: <input id="size" type="range" min="15" max="80" value="40"></label>
     <button type="button" id="resetBtn" class="tiny">Reset</button>
   </div>
 </div>
</main>
<script>
(()=>{'use strict';
const $=s=>document.getElementById(s);
const stage=$('stage'), camera=$('camera'), actor=$('actor'),actorVideo=$('actorVideo');
const canvas=$('actorCanvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
const snapshot=$('actorSnapshot'), snapCtx=snapshot.getContext('2d');
const off=document.createElement('canvas'),offCtx=off.getContext('2d',{willReadFrequently:true});
const size=$('size'), nextBtn=$('nextBtn'), prevBtn=$('prevBtn');
let stream=null,facing='environment',ready=false,arStarted=false;
let lastFrame=0,framesRunning=false,actorWidth=40,toastTimeout;
let currentIndex=1;
let progress=1;
let maxIndex=6;
let autoPlayPending=false;
const clamp=(x,min,max)=>Math.min(max,Math.max(min,x));
function announce(t){const el=$('status');if(el)el.textContent=t;}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').classList.remove('show'),3600);}
function videoUrl(index){return new URL(`./zheng${index}.mp4`,document.baseURI).href;}
function applySize(){actor.style.width=actorWidth+'vw';size.value=actorWidth;}
function saveSize(){try{localStorage.setItem('zg_ar_size',actorWidth);}catch(e){}}
try{const s=+localStorage.getItem('zg_ar_size');if(Number.isFinite(s))actorWidth=clamp(s,15,80);}catch(e){}
applySize();

function syncSoundBtn(){
  if(!ready){ $('soundBtn').disabled=true; return; }
  $('soundBtn').disabled=false;
  $('soundBtn').textContent = actorVideo.muted ? 'Enable Sound' : 'Mute Sound';
}

async function playUnmuted(){
  try{
    actorVideo.muted=false;
    await actorVideo.play();
    syncSoundBtn();
    return true;
  }catch(err){
    console.warn('Unmuted play rejected, falling back to muted', err);
    actorVideo.muted=true;
    try{ await actorVideo.play(); syncSoundBtn(); return true; }
    catch(e){ syncSoundBtn(); return false; }
  }
}

async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){announce('Camera requires an HTTPS or localhost environment');toast('Please open this page via HTTPS, or test on localhost.');return;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}

  // Start the actor video inside the user gesture for unmuted autoplay
  if(ready && actorVideo.paused){
    playUnmuted();
  }

  try{
    announce('Requesting camera permission…');
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});
    camera.srcObject=stream;camera.muted=true;await camera.play();
    arStarted=true;
    $('hint').classList.add('hide');
    actor.classList.add('visible');
    $('cameraBtn').classList.add('active');
    nextBtn.disabled=false;
    prevBtn.disabled=false;
    announce('Camera on');

    if(ready && actorVideo.paused) await playUnmuted();
    else if(!ready) autoPlayPending=true;   // wait for loadeddata to auto-play
  }catch(err){console.error(err);announce('Camera failed to start: '+err.name);toast('Cannot open camera: please allow camera access and use HTTPS.');}
}
$('cameraBtn').addEventListener('click',startCamera);
$('switchCameraBtn').addEventListener('click',()=>{facing=facing==='environment'?'user':'environment';startCamera();});

/* ---- Video switching with snapshot overlay (no blank frame) ---- */

function takeSnapshot(){
  // Copy the currently visible canvas into the snapshot overlay
  if(canvas.width>0 && canvas.height>0){
    snapshot.width=canvas.width;
    snapshot.height=canvas.height;
    snapCtx.clearRect(0,0,snapshot.width,snapshot.height);
    snapCtx.drawImage(canvas,0,0);
    snapshot.style.display='block';
  }
}

function prepareVideo(index){
  takeSnapshot();          // freeze the last visible frame
  ready=false;
  autoPlayPending=false;
  actorVideo.pause();
  currentIndex=index;
  actorVideo.loop=false;
  actorVideo.removeAttribute('loop');
  $('soundBtn').disabled=true;
  actorVideo.src=videoUrl(index);
  actorVideo.load();
  announce(`Loading video ${index}…`);
}

actorVideo.addEventListener('loadedmetadata',()=>{
  // Only read dimensions here; do NOT mark ready yet
  if(!actorVideo.videoWidth||!actorVideo.videoHeight){toast('The video has no readable frames.');return;}
  const w=Math.min(actorVideo.videoWidth,420);
  const h=Math.max(1,Math.round(w*actorVideo.videoHeight/actorVideo.videoWidth));
  // Resizing canvas will clear it, but the snapshot covers it visually
  off.width=canvas.width=w;
  off.height=canvas.height=h;
  actor.style.aspectRatio=actorVideo.videoWidth+'/'+actorVideo.videoHeight;
  canvas.style.display='block';
  $('actorPlaceholder').style.display='none';
});

actorVideo.addEventListener('loadeddata',()=>{
  // First frame is now available; draw it before hiding the snapshot
  ready=true;
  syncSoundBtn();
  nextBtn.disabled=!arStarted;
  if(!framesRunning){framesRunning=true;requestAnimationFrame(drawActor);}
  drawSingleFrame();
  // Hide snapshot on the next frame to guarantee the new frame is visible
  requestAnimationFrame(()=>{snapshot.style.display='none';});

  if(autoPlayPending && arStarted){
    autoPlayPending=false;
    autoPlayActor();
  }
  if(arStarted) announce(`Video ${currentIndex} loaded · playing`);
  else announce(`Video ${currentIndex} loaded. Tap "Start AR" to begin.`);
});

actorVideo.addEventListener('error',()=>{
 if(currentIndex>1){
   toast(`zheng${currentIndex}.mp4 not found. Back to video 1.`);
   maxIndex=Math.max(1,currentIndex-1);
   progress=Math.max(1,Math.min(progress,maxIndex));
   currentIndex=1;
   prepareVideo(1);
 }else{
   toast('Missing zheng1.mp4? Upload it next to index.html with the exact same filename.');
 }
});

/* Ended handler:
   - video 1: loop manually
   - video maxIndex: hold the final frame (do nothing)
   - videos 2..maxIndex-1: auto-return to video 1 */
actorVideo.addEventListener('ended', async ()=>{
  if(currentIndex===1){
    try{ actorVideo.currentTime=0; await actorVideo.play(); }catch(e){console.warn(e);}
  } else if(currentIndex===maxIndex){
    announce(`Video ${maxIndex} finished — holding final frame`);
    // Stay on the last frame; drawActor keeps re-drawing it each tick
  } else {
    try{ await playVideo(1); announce('Auto-returned to video 1'); }
    catch(e){ console.warn('Auto-return to 1 failed', e); }
  }
});

async function autoPlayActor(){
  if(!ready||!arStarted)return;
  const ok=await playUnmuted();
  announce(ok ? 'AR started · video playing' : 'Camera on; tap "Enable Sound" or retry Start AR');
}

function playVideo(index){
  return new Promise((resolve,reject)=>{
    prepareVideo(index);
    const onReady=async()=>{
      actorVideo.removeEventListener('loadeddata',onReady);
      actorVideo.removeEventListener('error',onErr);
      const ok=await playUnmuted();
      ok ? resolve() : reject(new Error('play rejected'));
    };
    const onErr=()=>{
      actorVideo.removeEventListener('loadeddata',onReady);
      actorVideo.removeEventListener('error',onErr);
      reject(new Error('load error'));
    };
    actorVideo.addEventListener('loadeddata',onReady);
    actorVideo.addEventListener('error',onErr);
  });
}

nextBtn.addEventListener('click', async ()=>{
  if(!arStarted) return;
  if(progress>=maxIndex){ toast('Already at the last video'); return; }
  progress++;
  try{
    await playVideo(progress);
    announce(`Playing video ${progress}`);
  }catch(err){
    if(progress>1){
      maxIndex=Math.max(1,progress-1);
      progress=Math.max(1,Math.min(progress-1,maxIndex));
      try{ await playVideo(progress); announce(`Playing video ${progress}`); }catch(e){}
    }
  }
});

prevBtn.addEventListener('click', async ()=>{
  if(!arStarted) return;
  if(progress<=1){ toast('Already at the first video'); return; }
  progress--;
  try{
    await playVideo(progress);
    announce(`Playing video ${progress}`);
  }catch(err){
    progress++;
    toast(`zheng${progress}.mp4 not found`);
  }
});

$('soundBtn').addEventListener('click',async()=>{
  if(!ready) return;
  if(actorVideo.muted){
    actorVideo.muted=false;
    try{ await actorVideo.play(); syncSoundBtn(); announce('Playing · sound enabled'); }
    catch(err){ actorVideo.muted=true; syncSoundBtn(); toast('Browser blocked audio playback.'); }
  } else {
    actorVideo.muted=true; syncSoundBtn(); announce('Playing · muted');
  }
});

function drawSingleFrame(){
 if(!ready||actorVideo.readyState<2)return;
 try{
  offCtx.clearRect(0,0,off.width,off.height);
  offCtx.drawImage(actorVideo,0,0,off.width,off.height);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const img=offCtx.getImageData(0,0,off.width,off.height);
  const data=img.data;
  const LOW=8;
  const RANGE=67;

  for(let i=0;i<data.length;i+=4){
   const a=data[i+3];
   if(a===0) continue;
   const r=data[i],g=data[i+1],b=data[i+2];
   const maxRB=r>b?r:b;
   const greenDiff=g-maxRB;
   if(greenDiff>LOW){
     let t=(greenDiff-LOW)/RANGE;
     if(t>1)t=1;
     const smooth=t*t*(3-2*t);
     data[i+3]=Math.round(a*(1-smooth));
     data[i+1]=Math.round(g-(g-maxRB)*smooth);
   }
  }
  ctx.putImageData(img,0,0);
 }catch(err){console.error(err);announce('Chroma key failed');}
}
function drawActor(ts){
 if(!framesRunning)return;
 if(!lastFrame||ts-lastFrame>=45){lastFrame=ts;if(ready&&actorVideo.readyState>=2)drawSingleFrame();}
 requestAnimationFrame(drawActor);
}

$('sizeBtn').addEventListener('click',()=>{
 $('adjustPanel').classList.toggle('show');
 $('sizeBtn').classList.toggle('active');
});
$('resetBtn').addEventListener('click',()=>{actorWidth=40;applySize();saveSize();announce('Character size reset');});
size.addEventListener('input',e=>{actorWidth=+e.target.value;applySize();saveSize();});

$('photoBtn').addEventListener('click',async()=>{
 if(camera.readyState<2){toast('Open the camera first to capture a photo.');return;}
 try{
  const r=stage.getBoundingClientRect(),out=document.createElement('canvas');
  const ratio=Math.min(window.devicePixelRatio||1,2);
  out.width=Math.round(r.width*ratio);out.height=Math.round(r.height*ratio);
  const g=out.getContext('2d');
  const vw=camera.videoWidth,vh=camera.videoHeight,target=out.width/out.height,source=vw/vh;
  if(source>target){const sw=vh*target;g.drawImage(camera,(vw-sw)/2,0,sw,vh,0,0,out.width,out.height);}
  else{const sh=vw/target;g.drawImage(camera,0,(vh-sh)/2,vw,sh,0,0,out.width,out.height);}
  if(ready){const a=actor.getBoundingClientRect();g.drawImage(canvas,(a.left-r.left)*ratio,(a.top-r.top)*ratio,a.width*ratio,a.height*ratio);}
  g.fillStyle='rgba(0,0,0,.46)';g.fillRect(0,out.height-32*ratio,out.width,32*ratio);
  g.fillStyle='#ffffff';g.font=(12*ratio)+'px sans-serif';g.textAlign='center';g.fillText('Zheng Guanying · AI-Restored Historical Figure',out.width/2,out.height-12*ratio);
  out.toBlob(async blob=>{
   if(!blob){toast('Failed to generate photo');return;}
   const file=new File([blob],'zheng-guanying-ar.png',{type:'image/png'});
   if(navigator.canShare?.({files:[file]})){
    try{await navigator.share({files:[file],title:'Zheng Guanying AI Photo'});return;}
    catch(e){if(e.name==='AbortError')return;}
   }
   const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='zheng-guanying-ar.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
   toast('Photo created. If it did not save automatically, use Share or long-press to save.');
  },'image/png');
 }catch(err){console.error(err);toast('Photo composition failed. Check that the camera is working.');}
});
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());});
prepareVideo(1);
})();
</script>
</body>
</html>
